<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=http://httpforever.com/" />
    <script>
      // Prefer JS redirect; keep meta refresh as a fallback.
      window.location.replace('http://httpforever.com/');
    </script>
  </head>
  <body>
    <noscript>
      <p>If you are not redirected automatically, <a href="http://httpforever.com/">click here</a>.</p>
    </noscript>
  </body>
</html>
